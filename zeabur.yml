services:
  slidemind:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - UPLOAD_DIR=/tmp/uploads
      - OUTPUT_DIR=/tmp/outputs
      - TEMP_DIR=/tmp/temp
      - NODE_ENV=production
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    resources:
      memory: 1G
      cpu: 0.5