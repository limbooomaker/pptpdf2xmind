services:
  slidemind:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - UPLOAD_DIR=/tmp/uploads
      - OUTPUT_DIR=/tmp/outputs
      - TEMP_DIR=/tmp/temp
      - NODE_ENV=production
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    resources:
      memory: 1G
      cpu: 0.5